    <!-- ---------------------------------------------------------------------- !-->
    <script>
         
        var backend; // Python-koppeling

        // Initialiseer het Qt WebChannel
        new QWebChannel(qt.webChannelTransport, 
            function (channel) 
                {
                backend = channel.objects.backend;
        
                backend.textChanged.connect(function(labelId, text) 
                    {
                    document.getElementById(labelId).innerText = text;                
                    });

                    
                backend.showLabel.connect(function(labelId, visible) 
                    {
                    document.getElementById(labelId).style.visibility = visible;                
                    });

                });

        
        document.addEventListener('click', 
            function(event) 
                {
                var button = event.target.closest('.button');
                if (backend && button) 
                    {
                    var tag = button.getAttribute('id');
                    backend.buttonClicked(tag);
                    }
                }
            );
            
        document.addEventListener('keypress', 
            function(event) 
                {
                if (backend) 
                    {
                    console.log(event);
					const payload = {
                		key: event.key,
                		code: event.code,
                		shiftKey: event.shiftKey,
                		ctrlKey: event.ctrlKey,
                		altKey: event.altKey,
            			};
            			                    
                    backend.keyPressed(JSON.stringify(payload));
                    }
                }
            );
            
    </script>
